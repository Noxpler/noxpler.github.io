<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CentiDevs | Portfolio</title>
  <style>
    :root {
      /* Deep space black to dark gold gradient */
      --bg-top: #050505;
      --bg-bottom: #1a1600;
      
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --gold-light: #f9df8a;
      
      --text-main: #f2f2f2;
      --text-muted: #a3a3a3;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(ellipse at bottom, var(--bg-bottom) 0%, var(--bg-top) 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* The canvas layer for the stars */
    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* Lets you click things under the canvas */
    }

    /* Entry animation wrapper */
    .popup-container {
      position: relative;
      z-index: 10;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      width: 90%;
      max-width: 450px;
    }

    .popup-container.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* The upgraded Glassmorphism Panel */
    .popup {
      background: rgba(15, 15, 15, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 50px 40px;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 25px rgba(212, 175, 55, 0.15);
      text-align: center;
      
      /* Continuous floating animation */
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    /* Upgraded Typography */
    .popup h1 {
      margin: 0 0 5px 0;
      font-size: 32px;
      letter-spacing: 2px;
      text-transform: uppercase;
      /* Gold gradient text */
      background: linear-gradient(to right, var(--gold), var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 0px 8px var(--gold-glow));
    }

    .popup h2 {
      margin: 0;
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .divider {
      width: 50px;
      height: 3px;
      background: var(--gold);
      margin: 25px auto;
      border-radius: 2px;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .popup p {
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 35px;
      font-size: 15px;
    }

    /* Upgraded Button */
    .btn-enter {
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 14px 36px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .btn-enter:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 25px var(--gold-glow);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Interactive Space Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Popup Wrapper for structural animations -->
  <div class="popup-container" id="popup-container">
    <div class="popup">
      <h1>CentiDevs</h1>
      <h2>UI Design & Development</h2>
      <div class="divider"></div>
      
      <p>Welcome to my portfolio. This space is dedicated to high-quality user interfaces, scripting, and custom development projects.</p>
      
      <button class="btn-enter" onclick="enterSite()">Enter Site</button>
    </div>
  </div>

  <script>
    // --- POPUP ANIMATION LOGIC ---
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('popup-container').classList.add('active');
      }, 300); 
    };

    function enterSite() {
      const container = document.getElementById('popup-container');
      container.style.opacity = '0';
      container.style.transform = 'translateY(-30px) scale(0.95)';
      setTimeout(() => {
        container.style.display = 'none';
        document.body.style.overflow = 'auto';
        // Add your redirect or page transition logic here
      }, 800);
    }

    // --- INTERACTIVE STARFIELD LOGIC ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let stars = [];
    
    // Mouse tracking for parallax
    let mouseX = 0;
    let mouseY = 0;
    let targetMouseX = 0;
    let targetMouseY = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      initStars();
    }

    // Creates the star objects
    function initStars() {
      stars = [];
      // Calculate amount of stars based on screen size (keeps it looking good on mobile and PC)
      const numStars = Math.floor((width * height) / 4000); 
      
      for(let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5, // Size of the star
          speed: Math.random() * 0.5 + 0.1, // Normal drifting speed
          opacity: Math.random(),
          // Some stars are gold, most are white
          color: Math.random() > 0.85 ? '#d4af37' : '#ffffff' 
        });
      }
    }

    // Track mouse movement
    window.addEventListener('mousemove', (e) => {
      // Get mouse position relative to the center of the screen
      targetMouseX = (e.clientX - width / 2) * 0.05;
      targetMouseY = (e.clientY - height / 2) * 0.05;
    });

    // Handle screen resizing
    window.addEventListener('resize', resize);

    function animate() {
      // Clear the canvas for the next frame
      ctx.clearRect(0, 0, width, height);
      
      // Smooth out the mouse movement (easing)
      mouseX += (targetMouseX - mouseX) * 0.1;
      mouseY += (targetMouseY - mouseY) * 0.1;

      stars.forEach(star => {
        // Draw the star
        ctx.globalAlpha = star.opacity;
        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();

        // Move the star (drift + mouse parallax)
        // Bigger stars (closer) move faster with the mouse
        star.y -= star.speed; 
        let parallaxX = mouseX * star.radius;
        let parallaxY = mouseY * star.radius;

        star.x -= parallaxX * 0.05;
        star.y -= parallaxY * 0.05;

        // Twinkle effect
        star.opacity += (Math.random() - 0.5) * 0.05;
        if (star.opacity < 0.1) star.opacity = 0.1;
        if (star.opacity > 1) star.opacity = 1;

        // Reset star to bottom if it floats off screen
        if(star.y < 0) {
          star.y = height;
          star.x = Math.random() * width;
        }
        if(star.x < 0) star.x = width;
        if(star.x > width) star.x = 0;
      });

      requestAnimationFrame(animate);
    }

    // Initialize and start animation
    resize();
    animate();
  </script>
</body>
</html>
